name: Build mtail Alpine

on:
  push:
    branches:
      - main
  schedule:
    - cron: "12 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mtail-alpine-publish
  cancel-in-progress: false

env:
  ALPINE_VERSION: ${{ vars.ALPINE_VERSION || 'auto' }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve inputs and check for changes
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "$1"
          }

          upstream=ghcr.io/jaqx0r/mtail
          alpine_repo=docker.io/library/alpine
          dest="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mtail-alpine"

          release=$(gh api repos/jaqx0r/mtail/releases/latest --jq '.tag_name')
          version=${release#v}

          if [[ "$ALPINE_VERSION" == "auto" ]]; then
            alpine_release=$(curl -fsSL --retry 3 https://alpinelinux.org/releases.json \
              | jq -er '.latest_stable | sub("^v"; "")')

            if [[ ! "$alpine_release" =~ ^([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
              echo "::error::Unexpected Alpine release: $alpine_release"
              exit 1
            fi

            ALPINE_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi

          echo "Alpine version: $ALPINE_VERSION"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected mtail release tag: $release"
            exit 1
          fi

          if [[ ! "$ALPINE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Expected ALPINE_VERSION in major.minor or major.minor.patch format"
            exit 1
          fi

          declare -A upstream_digest
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) suffix=amd64 ;;
              arm64) suffix=arm64v8 ;;
            esac

            ref="${upstream}:${version}-${suffix}"
            if ! result=$(digest_of "$ref" 2>&1); then
              if grep -Eiq 'manifest unknown|manifest_unknown|not found|404' <<< "$result"; then
                echo "::warning::Upstream image not available yet: $ref"
                exit 0
              fi
              printf '%s\n' "$result" >&2
              exit 1
            fi
            upstream_digest[$arch]=$result
          done

          alpine_ref="${alpine_repo}:${ALPINE_VERSION}"

          if ! alpine_digest=$(digest_of "$alpine_ref" 2>&1); then
            if grep -Eiq 'manifest unknown|manifest_unknown|not found|404' <<< "$alpine_digest"; then
              echo "::warning::Alpine image not available yet: $alpine_ref"
              exit 0
            fi

            printf '%s\n' "$alpine_digest" >&2
            exit 1
          fi

          dockerfile_hash=$(sha256sum Dockerfile | cut -d ' ' -f 1)
          workflow_hash=$(sha256sum .github/workflows/build.yml | cut -d ' ' -f 1)

          fingerprint=$(printf '%s\n' \
            "$version" "${upstream_digest[amd64]}" "${upstream_digest[arm64]}" \
            "$ALPINE_VERSION" "$alpine_digest" \
            "$dockerfile_hash" "$workflow_hash" \
            | sha256sum | cut -d ' ' -f 1)

          version_tag="${dest}:${version}-alpine${ALPINE_VERSION}"
          existing=""

          if version_digest=$(digest_of "$version_tag" 2>/dev/null); then
            amd64_manifest=$(docker buildx imagetools inspect --raw "${dest}@${version_digest}" \
              | jq -r '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty')

            if [[ -n "$amd64_manifest" ]]; then
              existing=$(docker buildx imagetools inspect \
                --format '{{json .Image}}' "${dest}@${amd64_manifest}" \
                | jq -r '.config.Labels["io.github.mtail-alpine.inputs"] // empty')
            fi
          fi

          if [[ "$existing" == "$fingerprint" ]]; then
            latest_digest=$(digest_of "${dest}:latest" 2>/dev/null || true)
            if [[ "$latest_digest" != "$version_digest" ]]; then
              docker buildx imagetools create \
                --tag "${dest}:latest" "${dest}@${version_digest}"
            fi
            echo "Inputs unchanged; skipping build."
            exit 0
          fi

          {
            echo "build=true"
            echo "dest=$dest"
            echo "version_tag=$version_tag"
            echo "amd64=${upstream}@${upstream_digest[amd64]}"
            echo "arm64=${upstream}@${upstream_digest[arm64]}"
            echo "alpine_image=${alpine_repo}@${alpine_digest}"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"

      - name: Build, smoke-test, and publish
        if: steps.resolve.outputs.build == 'true'
        env:
          DEST: ${{ steps.resolve.outputs.dest }}
          VERSION_TAG: ${{ steps.resolve.outputs.version_tag }}
          MTAIL_AMD64: ${{ steps.resolve.outputs.amd64 }}
          MTAIL_ARM64: ${{ steps.resolve.outputs.arm64 }}
          ALPINE_IMAGE: ${{ steps.resolve.outputs.alpine_image }}
          FINGERPRINT: ${{ steps.resolve.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail

          sources=()

          for arch in amd64 arm64; do
            case "$arch" in
              amd64) source="$MTAIL_AMD64" ;;
              arm64) source="$MTAIL_ARM64" ;;
            esac

            image="mtail-alpine:test-${arch}"
            metadata="${RUNNER_TEMP}/mtail-${arch}.json"

            build_args=(
              --platform "linux/${arch}"
              --build-arg "MTAIL_IMAGE=${source}"
              --build-arg "ALPINE_IMAGE=${ALPINE_IMAGE}"
              --label "io.github.mtail-alpine.inputs=${FINGERPRINT}"
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            )

            # Build locally and run smoke tests
            docker buildx build \
              "${build_args[@]}" \
              --tag "$image" \
              --load .

            docker run --rm --platform "linux/${arch}" "$image" -version

            # Push by digest without creating staging tags
            docker buildx build \
              "${build_args[@]}" \
              --output "type=image,name=${DEST},push=true,push-by-digest=true,name-canonical=true" \
              --metadata-file "$metadata" .

            digest=$(jq -er '."containerimage.digest"' "$metadata")
            sources+=("${DEST}@${digest}")
          done

          # Publish the multi-platform image
          docker buildx imagetools create \
            --tag "$VERSION_TAG" \
            --tag "${DEST}:latest" \
            "${sources[@]}"
